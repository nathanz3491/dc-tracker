<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','DejaVu Sans',Arial,sans-serif">
<defs><marker id="a0F6E75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0F6E75"/></marker><marker id="a5C6B73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#5C6B73"/></marker><marker id="aA83E33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#A83E33"/></marker></defs>
<rect width="1500" height="1000" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','DejaVu Sans',Arial,sans-serif" xml:space="preserve">
<text x="48.0" y="54.0" font-size="25" fill="#16242E" text-anchor="start" font-weight="700">tracker duplicates — raise a pair, rank it, answer it</text>
<text x="48.0" y="82.0" font-size="13" fill="#5C6B73" text-anchor="start">One site often has a builder, a landlord and an occupier. Every dedup key is correct; the building is one. Nothing here merges by itself.</text>
<rect x="48.0" y="100.0" width="11" height="11" rx="2.5" fill="#0F6E75"/>
<text x="65.0" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">free · deterministic</text>
<rect x="198.0" y="100.0" width="11" height="11" rx="2.5" fill="#B9C6CC"/>
<text x="215.0" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">one fetch or query</text>
<rect x="337.7" y="100.0" width="11" height="11" rx="2.5" fill="#D9891F"/>
<text x="354.7" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">costs a model call</text>
<rect x="477.4" y="100.0" width="11" height="11" rx="2.5" fill="#A83E33"/>
<text x="494.4" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">a refusal, rail or stop</text>
<line x1="48" y1="128" x2="1452" y2="128" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="162.0" font-size="10.5" fill="#5C6B73" text-anchor="start" font-weight="700" letter-spacing="2.4">HOW A PAIR IS RAISED</text>
<text x="263.2" y="162.0" font-size="11" fill="#5C6B73" text-anchor="start">three passes, unioned — each reaches duplicates the others structurally cannot</text>
<rect x="48.0" y="196.0" width="236.0" height="108.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="166.0" y="234.1" font-size="12" fill="#16242E" text-anchor="middle" font-weight="700">1 · same locality</text>
<text x="166.0" y="251.1" font-size="10" fill="#5C6B73" text-anchor="middle">rows sharing (city or county, state).</text>
<text x="166.0" y="264.7" font-size="10" fill="#5C6B73" text-anchor="middle">Finds what made capex need this:</text>
<text x="166.0" y="278.3" font-size="10" fill="#5C6B73" text-anchor="middle">one campus, four companies</text>
<rect x="48.0" y="318.0" width="236.0" height="108.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="166.0" y="356.1" font-size="12" fill="#16242E" text-anchor="middle" font-weight="700">2 · dedup keys</text>
<text x="166.0" y="373.1" font-size="10" fill="#5C6B73" text-anchor="middle">bucketed on company, not locality —</text>
<text x="166.0" y="386.7" font-size="10" fill="#5C6B73" text-anchor="middle">locality is the axis that disagrees.</text>
<text x="166.0" y="400.3" font-size="10" fill="#5C6B73" text-anchor="middle">Pairs county:richland with city:richland</text>
<rect x="48.0" y="440.0" width="236.0" height="108.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="166.0" y="478.1" font-size="12" fill="#16242E" text-anchor="middle" font-weight="700">3 · shared tranche key</text>
<text x="166.0" y="495.1" font-size="10" fill="#5C6B73" text-anchor="middle">starts from the key, not a place.</text>
<text x="166.0" y="508.7" font-size="10" fill="#5C6B73" text-anchor="middle">Reaches Crusoe's Abilene row and</text>
<text x="166.0" y="522.3" font-size="10" fill="#5C6B73" text-anchor="middle">Oracle's Shackelford County row</text>
<rect x="330.0" y="274.0" width="200.0" height="200.0" rx="7" fill="#F7F9F9" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="430.0" y="324.1" font-size="13" fill="#16242E" text-anchor="middle" font-weight="700">A suspected pair</text>
<text x="430.0" y="341.1" font-size="10" fill="#5C6B73" text-anchor="middle">carrying every signal that</text>
<text x="430.0" y="354.7" font-size="10" fill="#5C6B73" text-anchor="middle">holds for it, not only the</text>
<text x="430.0" y="368.3" font-size="10" fill="#5C6B73" text-anchor="middle">one that raised it.</text>
<text x="430.0" y="381.9" font-size="10" fill="#5C6B73" text-anchor="middle"></text>
<text x="430.0" y="395.5" font-size="10" fill="#5C6B73" text-anchor="middle">Recording only the latter left</text>
<text x="430.0" y="409.1" font-size="10" fill="#5C6B73" text-anchor="middle">31 live pairs with a single</text>
<text x="430.0" y="422.7" font-size="10" fill="#5C6B73" text-anchor="middle">evidence class and no route</text>
<text x="430.0" y="436.3" font-size="10" fill="#5C6B73" text-anchor="middle">to any decision</text>
<polyline points="284.0,250.0 307.0,250.0 307.0,374.0 330.0,374.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<polyline points="284.0,372.0 307.0,372.0 307.0,374.0 330.0,374.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<polyline points="284.0,494.0 307.0,494.0 307.0,374.0 330.0,374.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<text x="576.0" y="258.0" font-size="10.5" fill="#5C6B73" text-anchor="start" font-weight="700" letter-spacing="2.4">RANKED, STRONGEST FIRST</text>
<rect x="576.0" y="276.0" width="75.4" height="25" rx="12.5" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.2"/>
<text x="613.7" y="293.0" font-size="10.5" fill="#0F6E75" text-anchor="middle" font-weight="700">same name</text>
<rect x="660.4" y="276.0" width="93.2" height="25" rx="12.5" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.2"/>
<text x="707.0" y="293.0" font-size="10.5" fill="#0F6E75" text-anchor="middle" font-weight="700">same tranche</text>
<rect x="762.6" y="276.0" width="111.0" height="25" rx="12.5" fill="#EDF1F2" stroke="#5C6B73" stroke-width="1.2"/>
<text x="818.1" y="293.0" font-size="10.5" fill="#5C6B73" text-anchor="middle" font-weight="700">shared operator</text>
<rect x="882.6" y="276.0" width="105.1" height="25" rx="12.5" fill="#EDF1F2" stroke="#5C6B73" stroke-width="1.2"/>
<text x="935.1" y="293.0" font-size="10.5" fill="#5C6B73" text-anchor="middle" font-weight="700">city vs county</text>
<rect x="996.6" y="276.0" width="93.2" height="25" rx="12.5" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.2"/>
<text x="1043.2" y="293.0" font-size="10.5" fill="#A83E33" text-anchor="middle" font-weight="700">name overlap</text>
<text x="576.0" y="330.0" font-size="10.5" fill="#5C6B73" text-anchor="start">The order is what a reader can act on. 'city vs county' led it on the strength of being structural, so the report opened</text>
<text x="576.0" y="346.0" font-size="10.5" fill="#5C6B73" text-anchor="start">with 31 of 49 pairs of the one class no automated path can settle. A shared name word is a word: it sorts last, and it</text>
<text x="576.0" y="362.0" font-size="10.5" fill="#5C6B73" text-anchor="start">can never carry a merge on its own.</text>
<rect x="576.0" y="386.0" width="216.0" height="104.0" rx="7" fill="#E7EDEE" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="684.0" y="415.3" font-size="12" fill="#16242E" text-anchor="middle" font-weight="700">Grouped</text>
<text x="684.0" y="432.3" font-size="10" fill="#5C6B73" text-anchor="middle">pairs sharing an id are the</text>
<text x="684.0" y="445.9" font-size="10" fill="#5C6B73" text-anchor="middle">same building, so they are</text>
<text x="684.0" y="459.5" font-size="10" fill="#5C6B73" text-anchor="middle">unioned. Four rows make six</text>
<text x="684.0" y="473.1" font-size="10" fill="#5C6B73" text-anchor="middle">pairs and one decision, not six</text>
<polyline points="530.0,374.0 553.0,374.0 553.0,438.0 576.0,438.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="832.0" y="386.0" width="216.0" height="104.0" rx="7" fill="#FDF6E9" stroke="#D9891F" stroke-width="1.3"/>
<text x="940.0" y="415.3" font-size="12" fill="#16242E" text-anchor="middle" font-weight="700">Read by capex</text>
<text x="940.0" y="432.3" font-size="10" fill="#5C6B73" text-anchor="middle">rollup counts one row per</text>
<text x="940.0" y="445.9" font-size="10" fill="#5C6B73" text-anchor="middle">group and discloses the rest,</text>
<text x="940.0" y="459.5" font-size="10" fill="#5C6B73" text-anchor="middle">so a false pair holds a real</text>
<text x="940.0" y="473.1" font-size="10" fill="#5C6B73" text-anchor="middle">campus out of a quoted number</text>
<polyline points="792.0,438.0 832.0,438.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="1096.0" y="386.0" width="356.0" height="104.0" rx="7" fill="#F7F9F9" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="1110.0" y="415.3" font-size="12.5" fill="#16242E" text-anchor="left" font-weight="700">Which is why the answer matters</text>
<text x="1110.0" y="432.3" font-size="10.2" fill="#5C6B73" text-anchor="left">Parking is not cosmetic: it puts a real campus's</text>
<text x="1110.0" y="445.9" font-size="10.2" fill="#5C6B73" text-anchor="left">capacity back into the buyer table. Merging is the</text>
<text x="1110.0" y="459.5" font-size="10.2" fill="#5C6B73" text-anchor="left">only repair for a real duplicate, and it deletes rows.</text>
<text x="1110.0" y="473.1" font-size="10.2" fill="#5C6B73" text-anchor="left">Leaving it keeps one row out of every capex total.</text>
<line x1="48" y1="574" x2="1452" y2="574" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="608.0" font-size="10.5" fill="#5C6B73" text-anchor="start" font-weight="700" letter-spacing="2.4">THE THREE ANSWERS</text>
<text x="233.3" y="608.0" font-size="11" fill="#5C6B73" text-anchor="start">duplicates proposes; a person, a model or an agent disposes</text>
<rect x="48.0" y="640.0" width="226.0" height="200.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="62.0" y="669.7" font-size="13" fill="#16242E" text-anchor="left" font-weight="700">Who decides</text>
<text x="62.0" y="686.7" font-size="10.2" fill="#5C6B73" text-anchor="left">--agent   default. Reads both rows'</text>
<text x="62.0" y="700.3" font-size="10.2" fill="#5C6B73" text-anchor="left">          articles, searches, then rules</text>
<text x="62.0" y="713.9" font-size="10.2" fill="#5C6B73" text-anchor="left"></text>
<text x="62.0" y="727.5" font-size="10.2" fill="#5C6B73" text-anchor="left">--ask     a person at the keyboard,</text>
<text x="62.0" y="741.1" font-size="10.2" fill="#5C6B73" text-anchor="left">          trusted for a merge outright</text>
<text x="62.0" y="754.7" font-size="10.2" fill="#5C6B73" text-anchor="left"></text>
<text x="62.0" y="768.3" font-size="10.2" fill="#5C6B73" text-anchor="left">--no-agent  the older one-call path,</text>
<text x="62.0" y="781.9" font-size="10.2" fill="#5C6B73" text-anchor="left">          shown two rows and nothing else</text>
<text x="62.0" y="795.5" font-size="10.2" fill="#5C6B73" text-anchor="left"></text>
<text x="62.0" y="809.1" font-size="10.2" fill="#5C6B73" text-anchor="left">all three are asked one question:</text>
<text x="62.0" y="822.7" font-size="10.2" fill="#5C6B73" text-anchor="left">what would rule this match OUT?</text>
<rect x="320.0" y="630.0" width="190.0" height="58.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="415.0" y="656.7" font-size="12.5" fill="#0F6E75" text-anchor="middle" font-weight="700">different sites</text>
<text x="415.0" y="673.7" font-size="10" fill="#5C6B73" text-anchor="middle">parks the pair, at 0.6 or above</text>
<rect x="320.0" y="706.0" width="190.0" height="58.0" rx="7" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.3"/>
<text x="415.0" y="732.7" font-size="12.5" fill="#A83E33" text-anchor="middle" font-weight="700">same site</text>
<text x="415.0" y="749.7" font-size="10" fill="#5C6B73" text-anchor="middle">merges — behind --merge</text>
<rect x="320.0" y="782.0" width="190.0" height="84.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="415.0" y="808.1" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">unclear</text>
<text x="415.0" y="825.1" font-size="10" fill="#5C6B73" text-anchor="middle">stays in the report, and</text>
<text x="415.0" y="838.7" font-size="10" fill="#5C6B73" text-anchor="middle">capex keeps one row of the</text>
<text x="415.0" y="852.3" font-size="10" fill="#5C6B73" text-anchor="middle">group out of the total</text>
<polyline points="274.0,700.0 297.0,700.0 297.0,659.0 320.0,659.0" fill="none" stroke="#0F6E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a0F6E75)"/>
<polyline points="274.0,735.0 320.0,735.0" fill="none" stroke="#A83E33" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#aA83E33)"/>
<polyline points="274.0,780.0 297.0,780.0 297.0,824.0 320.0,824.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="936.0" y="630.0" width="200.0" height="104.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="1036.0" y="659.3" font-size="12.5" fill="#0F6E75" text-anchor="middle" font-weight="700">not_duplicate</text>
<text x="1036.0" y="676.3" font-size="10" fill="#5C6B73" text-anchor="middle">decided_by records 'operator',</text>
<text x="1036.0" y="689.9" font-size="10" fill="#5C6B73" text-anchor="middle">'model (0.87)' or 'agent (0.91)':</text>
<text x="1036.0" y="703.5" font-size="10" fill="#5C6B73" text-anchor="middle">a reader must be able to tell</text>
<text x="1036.0" y="717.1" font-size="10" fill="#5C6B73" text-anchor="middle">which of them read the sources</text>
<polyline points="510.0,659.0 700.0,659.0 700.0,682.0 936.0,682.0" fill="none" stroke="#0F6E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a0F6E75)"/>
<rect x="556.0" y="696.0" width="356.0" height="198.0" rx="7" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.3"/>
<text x="570.0" y="724.7" font-size="13" fill="#A83E33" text-anchor="left" font-weight="700">Rails · what --merge still refuses, one function for both judges</text>
<text x="570.0" y="741.7" font-size="10.2" fill="#5C6B73" text-anchor="left">· confidence under the floor — 0.85 for the agent, 0.9 for</text>
<text x="570.0" y="755.3" font-size="10.2" fill="#5C6B73" text-anchor="left">   the one-call path, far above what a park needs</text>
<text x="570.0" y="768.9" font-size="10.2" fill="#5C6B73" text-anchor="left">· evidence is only a shared name word, even with --weak</text>
<text x="570.0" y="782.5" font-size="10.2" fill="#5C6B73" text-anchor="left">· evidence is only a cross-granularity key match — the old</text>
<text x="570.0" y="796.1" font-size="10.2" fill="#5C6B73" text-anchor="left">   path refuses outright; the agent may rule, because it</text>
<text x="570.0" y="809.7" font-size="10.2" fill="#5C6B73" text-anchor="left">   can read the articles and be a person with a map</text>
<text x="570.0" y="823.3" font-size="10.2" fill="#5C6B73" text-anchor="left">· the only shared tranche names a market and a sequence:</text>
<text x="570.0" y="836.9" font-size="10.2" fill="#5C6B73" text-anchor="left">   iad-3, hillsboro-1, held by two operators 60 km apart</text>
<text x="570.0" y="850.5" font-size="10.2" fill="#5C6B73" text-anchor="left">· the names differ by an ordinal — Polaris Forge 1 and 2</text>
<text x="570.0" y="864.1" font-size="10.2" fill="#5C6B73" text-anchor="left">· the coordinates are over 25 km apart. Geography wins</text>
<text x="570.0" y="877.7" font-size="10.2" fill="#5C6B73" text-anchor="left">· the agent quoted no sentence from an article it read</text>
<polyline points="510.0,735.0 533.0,735.0 533.0,795.0 556.0,795.0" fill="none" stroke="#A83E33" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#aA83E33)"/>
<rect x="936.0" y="756.0" width="200.0" height="110.0" rx="7" fill="#E7EDEE" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="1036.0" y="774.7" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">tracker merge</text>
<text x="1036.0" y="791.7" font-size="10" fill="#5C6B73" text-anchor="middle">every rail cleared, then: the</text>
<text x="1036.0" y="805.3" font-size="10" fill="#5C6B73" text-anchor="middle">survivor is the row with more</text>
<text x="1036.0" y="818.9" font-size="10" fill="#5C6B73" text-anchor="middle">citations, then more fields,</text>
<text x="1036.0" y="832.5" font-size="10" fill="#5C6B73" text-anchor="middle">then the lower id — never the</text>
<text x="1036.0" y="846.1" font-size="10" fill="#5C6B73" text-anchor="middle">model's choice, and nearly</text>
<text x="1036.0" y="859.7" font-size="10" fill="#5C6B73" text-anchor="middle">consequence-free</text>
<polyline points="912.0,795.0 924.0,795.0 924.0,811.0 936.0,811.0" fill="none" stroke="#A83E33" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#aA83E33)"/>
<rect x="1160.0" y="630.0" width="292.0" height="236.0" rx="7" fill="#F7F9F9" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="1174.0" y="657.3" font-size="13" fill="#16242E" text-anchor="left" font-weight="700">The group, and what is outside it</text>
<text x="1174.0" y="674.3" font-size="10.2" fill="#5C6B73" text-anchor="left">duplicates · list the suspected groups</text>
<text x="1174.0" y="687.9" font-size="10.2" fill="#5C6B73" text-anchor="left">duplicates park · these are different sites</text>
<text x="1174.0" y="701.5" font-size="10.2" fill="#5C6B73" text-anchor="left">duplicates unpark · reopen that decision</text>
<text x="1174.0" y="715.1" font-size="10.2" fill="#5C6B73" text-anchor="left">duplicates parked · who ruled what, and why</text>
<text x="1174.0" y="728.7" font-size="10.2" fill="#5C6B73" text-anchor="left">duplicates resolve · work through them</text>
<text x="1174.0" y="742.3" font-size="10.2" fill="#5C6B73" text-anchor="left"></text>
<text x="1174.0" y="755.9" font-size="10.2" fill="#5C6B73" text-anchor="left">merge lives outside the group on purpose:</text>
<text x="1174.0" y="769.5" font-size="10.2" fill="#5C6B73" text-anchor="left">it deletes rows, and that deserves its own</text>
<text x="1174.0" y="783.1" font-size="10.2" fill="#5C6B73" text-anchor="left">name.</text>
<text x="1174.0" y="796.7" font-size="10.2" fill="#5C6B73" text-anchor="left"></text>
<text x="1174.0" y="810.3" font-size="10.2" fill="#5C6B73" text-anchor="left">A wrong merge destroys two rows and no</text>
<text x="1174.0" y="823.9" font-size="10.2" fill="#5C6B73" text-anchor="left">re-crawl recovers them; a wrong split is</text>
<text x="1174.0" y="837.5" font-size="10.2" fill="#5C6B73" text-anchor="left">visible and recoverable. That asymmetry is</text>
<text x="1174.0" y="851.1" font-size="10.2" fill="#5C6B73" text-anchor="left">why every rail above refuses rather than asks.</text>
<line x1="48" y1="938" x2="1452" y2="938" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="966.0" font-size="12.5" fill="#16242E" text-anchor="start">Prevention is cheaper than all of this: sync's identity arbiter makes the same judgement one call before the row exists. Clearing 47 stored groups took a ten-hour agent run.</text>
</g>
</svg>
