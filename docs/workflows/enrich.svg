<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','DejaVu Sans',Arial,sans-serif">
<defs><marker id="a0F6E75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0F6E75"/></marker><marker id="a5C6B73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#5C6B73"/></marker><marker id="aA83E33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#A83E33"/></marker></defs>
<rect width="1500" height="1010" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','DejaVu Sans',Arial,sans-serif" xml:space="preserve">
<text x="48.0" y="54.0" font-size="25" fill="#16242E" text-anchor="start" font-weight="700">tracker enrich — every method at one row, cheapest first</text>
<text x="48.0" y="82.0" font-size="13" fill="#5C6B73" text-anchor="start">Six harvesters in cost order. A round that fills nothing ends the run, and the two model rungs go last, on whatever is left.</text>
<rect x="48.0" y="100.0" width="11" height="11" rx="2.5" fill="#0F6E75"/>
<text x="65.0" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">free · deterministic</text>
<rect x="198.0" y="100.0" width="11" height="11" rx="2.5" fill="#B9C6CC"/>
<text x="215.0" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">one fetch or query</text>
<rect x="337.7" y="100.0" width="11" height="11" rx="2.5" fill="#D9891F"/>
<text x="354.7" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">costs a model call</text>
<rect x="477.4" y="100.0" width="11" height="11" rx="2.5" fill="#A83E33"/>
<text x="494.4" y="109.0" font-size="10" fill="#5C6B73" text-anchor="start">a refusal, rail or stop</text>
<line x1="48" y1="128" x2="1452" y2="128" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="162.0" font-size="10.5" fill="#5C6B73" text-anchor="start" font-weight="700" letter-spacing="2.4">THE RUN</text>
<text x="133.7" y="162.0" font-size="11" fill="#5C6B73" text-anchor="start">one project at a time, under one shared article budget</text>
<rect x="48.0" y="196.0" width="186.0" height="44.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="141.0" y="215.7" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">tracker enrich 90 93</text>
<text x="141.0" y="232.7" font-size="10" fill="#5C6B73" text-anchor="middle">no field target — work the row</text>
<rect x="48.0" y="250.0" width="186.0" height="44.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="141.0" y="269.7" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">--select 30</text>
<text x="141.0" y="286.7" font-size="10" fill="#5C6B73" text-anchor="middle">the 30 closest to nine fields</text>
<rect x="48.0" y="304.0" width="186.0" height="44.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="141.0" y="323.7" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">--all</text>
<text x="141.0" y="340.7" font-size="10" fill="#5C6B73" text-anchor="middle">every row still below nine</text>
<rect x="278.0" y="196.0" width="178.0" height="152.0" rx="7" fill="#E7EDEE" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="367.0" y="242.5" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">Rows, ordered</text>
<text x="367.0" y="259.5" font-size="10" fill="#5C6B73" text-anchor="middle">closest to the target first,</text>
<text x="367.0" y="273.1" font-size="10" fill="#5C6B73" text-anchor="middle">capacity breaks the tie,</text>
<text x="367.0" y="286.7" font-size="10" fill="#5C6B73" text-anchor="middle">finished rows excluded</text>
<text x="367.0" y="300.3" font-size="10" fill="#5C6B73" text-anchor="middle"></text>
<text x="367.0" y="313.9" font-size="10" fill="#5C6B73" text-anchor="middle">--budget is the real ceiling</text>
<polyline points="234.0,218.0 278.0,218.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<polyline points="234.0,272.0 278.0,272.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<polyline points="234.0,326.0 278.0,326.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="278.0" y="386.0" width="178.0" height="78.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="367.0" y="409.1" font-size="12.5" fill="#0F6E75" text-anchor="middle" font-weight="700">1 · derive</text>
<text x="367.0" y="426.1" font-size="10" fill="#5C6B73" text-anchor="middle">county, lat, lon from Census.</text>
<text x="367.0" y="439.7" font-size="10" fill="#5C6B73" text-anchor="middle">Free and certain, so these</text>
<text x="367.0" y="453.3" font-size="10" fill="#5C6B73" text-anchor="middle">fields are never searched for</text>
<polyline points="367.0,348.0 367.0,386.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="492.0" y="176.0" width="314.0" height="400.0" rx="9" fill="none" stroke="#D9891F" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="506.0" y="195.0" font-size="10.5" fill="#D9891F" text-anchor="start" font-weight="700" letter-spacing="1.4">HARVEST · repeated, up to six rounds</text>
<rect x="514.0" y="210.0" width="270.0" height="44.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="649.0" y="229.7" font-size="11.5" fill="#0F6E75" text-anchor="middle" font-weight="700">2 · queue</text>
<text x="649.0" y="246.7" font-size="10" fill="#5C6B73" text-anchor="middle">candidates already naming this row</text>
<rect x="514.0" y="264.0" width="270.0" height="44.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="649.0" y="283.7" font-size="11.5" fill="#0F6E75" text-anchor="middle" font-weight="700">3 · retry</text>
<text x="649.0" y="300.7" font-size="10" fill="#5C6B73" text-anchor="middle">its URLs that failed to fetch</text>
<rect x="514.0" y="318.0" width="270.0" height="56.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="649.0" y="336.9" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">4 · archive</text>
<text x="649.0" y="353.9" font-size="10" fill="#5C6B73" text-anchor="middle">sitemap sweep, filtered to this row</text>
<text x="649.0" y="367.5" font-size="10" fill="#5C6B73" text-anchor="middle">round 1 · key-free · swept once a batch</text>
<rect x="514.0" y="384.0" width="270.0" height="56.0" rx="7" fill="#FBF2E4" stroke="#D9891F" stroke-width="1.3"/>
<text x="649.0" y="402.9" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">5 · search</text>
<text x="649.0" y="419.9" font-size="10" fill="#5C6B73" text-anchor="middle">queries built from this row's own gaps</text>
<text x="649.0" y="433.5" font-size="10" fill="#5C6B73" text-anchor="middle">needs a key · at most twelve</text>
<rect x="514.0" y="450.0" width="270.0" height="56.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="649.0" y="468.9" font-size="11.5" fill="#16242E" text-anchor="middle" font-weight="700">6 · refresh</text>
<text x="649.0" y="485.9" font-size="10" fill="#5C6B73" text-anchor="middle">its own citations, re-read</text>
<text x="649.0" y="499.5" font-size="10" fill="#5C6B73" text-anchor="middle">round 1 only</text>
<polyline points="456.0,425.0 474.0,425.0 474.0,232.0 514.0,232.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="844.0" y="232.0" width="186.0" height="86.0" rx="7" fill="#F7F9F9" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="937.0" y="259.1" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">Pooled, then filtered</text>
<text x="937.0" y="276.1" font-size="10" fill="#5C6B73" text-anchor="middle">de-duplicated across harvesters;</text>
<text x="937.0" y="289.7" font-size="10" fill="#5C6B73" text-anchor="middle">publishers seed/sources.toml</text>
<text x="937.0" y="303.3" font-size="10" fill="#5C6B73" text-anchor="middle">ignores are dropped first</text>
<rect x="844.0" y="362.0" width="186.0" height="78.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="937.0" y="385.1" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">Read and extract</text>
<text x="937.0" y="402.1" font-size="10" fill="#5C6B73" text-anchor="middle">crawl.run, force=True — a cited</text>
<text x="937.0" y="415.7" font-size="10" fill="#5C6B73" text-anchor="middle">page may support a field the</text>
<text x="937.0" y="429.3" font-size="10" fill="#5C6B73" text-anchor="middle">gate dropped last time</text>
<polyline points="806.0,352.0 825.0,352.0 825.0,275.0 844.0,275.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<polyline points="937.0,318.0 937.0,362.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="900.9" y="323.0" width="72.1" height="15" fill="#FFFFFF" opacity="0.94"/>
<text x="937.0" y="334.0" font-size="10" fill="#5C6B73" text-anchor="middle" font-weight="700">unread only</text>
<rect x="1076.0" y="344.0" width="190.0" height="92.0" rx="7" fill="#FDF6E9" stroke="#D9891F" stroke-width="1.3"/>
<text x="1171.0" y="387.7" font-size="13" fill="#16242E" text-anchor="middle" font-weight="700">Did the round fill</text>
<text x="1171.0" y="404.7" font-size="10" fill="#5C6B73" text-anchor="middle">a field that was empty?</text>
<polyline points="1030.0,401.0 1053.0,401.0 1053.0,390.0 1076.0,390.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="1310.0" y="344.0" width="142.0" height="92.0" rx="7" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.3"/>
<text x="1381.0" y="380.9" font-size="12.5" fill="#A83E33" text-anchor="middle" font-weight="700">no — stop</text>
<text x="1381.0" y="397.9" font-size="10" fill="#5C6B73" text-anchor="middle">the real stop</text>
<text x="1381.0" y="411.5" font-size="10" fill="#5C6B73" text-anchor="middle">condition</text>
<polyline points="1266.0,390.0 1310.0,390.0" fill="none" stroke="#A83E33" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#aA83E33)"/>
<polyline points="1171.0,436.0 1171.0,552.0 649.0,552.0 649.0,576.0" fill="none" stroke="#0F6E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a0F6E75)"/>
<rect x="848.5" y="555.0" width="123.0" height="15" fill="#FFFFFF" opacity="0.94"/>
<text x="910.0" y="566.0" font-size="10" fill="#0F6E75" text-anchor="middle" font-weight="700">yes — go round again</text>
<text x="48.0" y="612.0" font-size="10.5" fill="#5C6B73" text-anchor="start">The other four stops, each reported by name: every field is filled · the row is already at the target, which is a refusal phrased so it cannot read as success · no harvester found an unread article · the six-round ceiling.</text>
<line x1="48" y1="636" x2="1452" y2="636" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="676.0" font-size="10.5" fill="#5C6B73" text-anchor="start" font-weight="700" letter-spacing="2.4">AFTER THE ROUNDS</text>
<text x="223.4" y="676.0" font-size="11" fill="#5C6B73" text-anchor="start">two model rungs, in this order, on what the cheap passes could not reach</text>
<rect x="48.0" y="716.0" width="190.0" height="84.0" rx="7" fill="#EDF1F2" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="143.0" y="742.1" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">Contested fields</text>
<text x="143.0" y="759.1" font-size="10" fill="#5C6B73" text-anchor="middle">two quote-backed claims</text>
<text x="143.0" y="772.7" font-size="10" fill="#5C6B73" text-anchor="middle">that genuinely disagree —</text>
<text x="143.0" y="786.3" font-size="10" fill="#5C6B73" text-anchor="middle">which harvesting creates</text>
<rect x="286.0" y="706.0" width="208.0" height="104.0" rx="7" fill="#FBF2E4" stroke="#D9891F" stroke-width="1.3"/>
<text x="390.0" y="735.3" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">7 · settle</text>
<text x="390.0" y="752.3" font-size="10" fill="#5C6B73" text-anchor="middle">one reasoning call reads every</text>
<text x="390.0" y="765.9" font-size="10" fill="#5C6B73" text-anchor="middle">claim about one field at once,</text>
<text x="390.0" y="779.5" font-size="10" fill="#5C6B73" text-anchor="middle">with dates. Picks one, or refuses.</text>
<text x="390.0" y="793.1" font-size="10" fill="#5C6B73" text-anchor="middle">Not the extractor that read the pages</text>
<polyline points="238.0,758.0 286.0,758.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="554.0" y="716.0" width="200.0" height="84.0" rx="7" fill="#E7F0F0" stroke="#0F6E75" stroke-width="1.3"/>
<text x="654.0" y="742.1" font-size="12.5" fill="#0F6E75" text-anchor="middle" font-weight="700">Supersede the losers</text>
<text x="654.0" y="759.1" font-size="10" fill="#5C6B73" text-anchor="middle">the field is never assigned;</text>
<text x="654.0" y="772.7" font-size="10" fill="#5C6B73" text-anchor="middle">the row is re-derived, so it still</text>
<text x="654.0" y="786.3" font-size="10" fill="#5C6B73" text-anchor="middle">equals what its citations imply</text>
<polyline points="494.0,758.0 554.0,758.0" fill="none" stroke="#0F6E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a0F6E75)"/>
<rect x="496.4" y="741.0" width="55.2" height="15" fill="#FFFFFF" opacity="0.94"/>
<text x="524.0" y="752.0" font-size="10" fill="#0F6E75" text-anchor="middle" font-weight="700">resolved</text>
<rect x="286.0" y="838.0" width="208.0" height="62.0" rx="7" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.3"/>
<text x="390.0" y="859.9" font-size="11.5" fill="#A83E33" text-anchor="middle" font-weight="700">refused</text>
<text x="390.0" y="876.9" font-size="10" fill="#5C6B73" text-anchor="middle">the disagreement stays in the notes,</text>
<text x="390.0" y="890.5" font-size="10" fill="#5C6B73" text-anchor="middle">and is asked again next run</text>
<polyline points="390.0,810.0 390.0,838.0" fill="none" stroke="#A83E33" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#aA83E33)"/>
<rect x="802.0" y="706.0" width="208.0" height="104.0" rx="7" fill="#FBF2E4" stroke="#D9891F" stroke-width="1.3"/>
<text x="906.0" y="735.3" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">8 · agent pass</text>
<text x="906.0" y="752.3" font-size="10" fill="#5C6B73" text-anchor="middle">a model picks its own searches</text>
<text x="906.0" y="765.9" font-size="10" fill="#5C6B73" text-anchor="middle">for what the query templates</text>
<text x="906.0" y="779.5" font-size="10" fill="#5C6B73" text-anchor="middle">could not reach, and cites it.</text>
<text x="906.0" y="793.1" font-size="10" fill="#5C6B73" text-anchor="middle">~77,000 tokens a row, so it is last</text>
<polyline points="754.0,758.0 802.0,758.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="1058.0" y="700.0" width="224.0" height="116.0" rx="7" fill="#E7EDEE" stroke="#B9C6CC" stroke-width="1.3"/>
<text x="1170.0" y="735.3" font-size="12.5" fill="#16242E" text-anchor="middle" font-weight="700">The row</text>
<text x="1170.0" y="752.3" font-size="10" fill="#5C6B73" text-anchor="middle">nine of twelve tracked fields is the bar</text>
<text x="1170.0" y="765.9" font-size="10" fill="#5C6B73" text-anchor="middle"></text>
<text x="1170.0" y="779.5" font-size="10" fill="#5C6B73" text-anchor="middle">citations up, confidence rescored,</text>
<text x="1170.0" y="793.1" font-size="10" fill="#5C6B73" text-anchor="middle">and every stop reason on screen</text>
<polyline points="1010.0,758.0 1058.0,758.0" fill="none" stroke="#5C6B73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a5C6B73)"/>
<rect x="1310.0" y="694.0" width="142.0" height="126.0" rx="7" fill="#F7EBE9" stroke="#A83E33" stroke-width="1.3"/>
<text x="1381.0" y="713.9" font-size="12.5" fill="#A83E33" text-anchor="middle" font-weight="700">--dry-run</text>
<text x="1381.0" y="730.9" font-size="10" fill="#5C6B73" text-anchor="middle">harvests and</text>
<text x="1381.0" y="744.5" font-size="10" fill="#5C6B73" text-anchor="middle">reports only.</text>
<text x="1381.0" y="758.1" font-size="10" fill="#5C6B73" text-anchor="middle"></text>
<text x="1381.0" y="771.7" font-size="10" fill="#5C6B73" text-anchor="middle">Extraction is skipped</text>
<text x="1381.0" y="785.3" font-size="10" fill="#5C6B73" text-anchor="middle">outright, so a</text>
<text x="1381.0" y="798.9" font-size="10" fill="#5C6B73" text-anchor="middle">preview cannot</text>
<text x="1381.0" y="812.5" font-size="10" fill="#5C6B73" text-anchor="middle">bill you</text>
<line x1="48" y1="948" x2="1452" y2="948" stroke="#B9C6CC" stroke-width="1"/>
<text x="48.0" y="976.0" font-size="12.5" fill="#16242E" text-anchor="start">Cost order is the whole design: an expensive rung never runs for a field a free one would have filled, and the run stops on diminishing returns rather than on a fixed article count.</text>
</g>
</svg>
