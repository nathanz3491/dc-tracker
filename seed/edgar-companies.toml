# Companies whose SEC filings `tracker ingest edgar` reads.
#
# Operator-editable: add a company here without touching code.
#
# WHY A LIST AT ALL, rather than searching the whole of EDGAR.
#
# EDGAR full-text search takes a `ciks` filter and it is the difference between
# a usable source and an unusable one. Measured on the live API:
#
#   q="data center campus", no filter   -> 1,066 hits, and the first three are
#                                          all the same shell company
#   q="data center", ciks=0001326801    ->   105 hits, every one of them Meta
#
# Unfiltered phrase search is dominated by micro-cap shells and crypto miners
# that mention data centers in passing. Scoping by company makes precision a
# property of the query rather than something to filter for afterwards, so this
# file IS the precision mechanism.
#
# `sics` is accepted by the API and silently ignored — 6798, 6770 and no filter
# all return an identical 4,868 hits — so filtering by industry is not an option.
#
# CIKs MUST be the 10-digit zero-padded form. `1326801` returns zero hits where
# `0001326801` returns 105; the API does not pad for you and does not complain.
# Resolve one from https://www.sec.gov/files/company_tickers.json.
#
# `kind` records why the company is here. `tracker capex` reads it to decide who
# is buying their own capacity, and `--kind` filters a run to one class:
#   hyperscaler  the end customer whose capex we are ultimately tracking
#   neocloud     AI-native operators, often their own tenant
#   landlord     wholesale/colocation REITs and developers
#   utility      the power company on the other side of the interconnection
#   contractor   whoever is actually building it
#
# Only `hyperscaler` and `neocloud` count as end users in `capex.attribute`. A
# utility is not buying compute and a contractor is not either, so adding them
# cannot quietly change who capacity is attributed to — they are here to be
# *sources*, not buyers.
#
# COST. Every company multiplies the default run: companies x phrases x
# --per-company, one LLM call per filing that survives selection. With the
# utilities and contractors added, a bare `tracker ingest edgar` is roughly twice
# what it was. Use `--kind utility --per-company 1` to read one class, which is
# also the honest way to find out whether a class is worth reading at all.
#
# A note on the landlords. Their filings are wall-to-wall data center, which
# sounds ideal and is not: the section extractor has a fixed character budget and
# on a pure-play REIT there is no "data center section" to find, so recall drops
# to roughly 20% against 90%+ for the hyperscalers. What survives is portfolio
# aggregate rather than per-project detail. They are kept because lease footnotes
# name tenants, which is the one thing nothing else gives us — but expect thin
# returns per call and consider `--forms 10-Q` for them.

[[company]]
name = "Meta"
cik = "0001326801"
kind = "hyperscaler"

[[company]]
name = "Alphabet"
cik = "0001652044"
kind = "hyperscaler"

[[company]]
