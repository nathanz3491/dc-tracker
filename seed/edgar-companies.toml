# --- Contractors --------------------------------------------------------------
#
# What a builder discloses is *backlog*, and backlog leads energisation by a year
# or two — which makes it the closest thing to a forward indicator in this
# dataset. It is also the weakest at naming sites: an E&C 10-K says "data center
# end market grew 40%", not which campus. Expect corroboration and timing rather
# than new projects, and judge the class on that.

[[company]]
name = "Quanta Services"   # electrical infrastructure, substations
cik = "0001050915"
kind = "contractor"

[[company]]
name = "EMCOR Group"       # mechanical and electrical fit-out
cik = "0000105634"
kind = "contractor"

[[company]]
name = "Sterling Infrastructure"  # site development; names data centers explicitly
cik = "0000874238"
kind = "contractor"

[[company]]
name = "Comfort Systems USA"  # HVAC, and unusually explicit about the end market
cik = "0001035983"
kind = "contractor"

[[company]]
name = "MYR Group"
cik = "0000700923"
kind = "contractor"

[[company]]
name = "Argan"             # Gemma Power — the on-site generation EPC
cik = "0000100591"
kind = "contractor"


# Phrases handed to full-text search, ANDed with the company scope above.
#
# Kept broad on purpose. Precision comes from `ciks`, so a narrow phrase only
# costs recall — "data center" against one company's filings is already precise.
#
# The lease phrases are here for a specific measured gap. After two rounds of
# ingestion only 30% of projects could be attributed to a buyer at all, and the
# unattributed remainder is almost entirely wholesale developers building for
# somebody they have not named in the press. A lease disclosure is the one public
# document that does name the counterparty, so these phrases target the single
# weakest field rather than adding more of what already works.
[search]
phrases = [
  "\"data center\"",
  "\"data centre\"",
  "\"lease agreement\" \"data center\"",
  "\"anchor tenant\"",
  "\"build-to-suit\"",
]

# Phrases used INSTEAD of the list above, for companies of a given kind.
#
# A utility does not write "build-to-suit" and an E&C contractor does not write
# "anchor tenant". Both write about data centers, so the base list is not wrong —
# it is just not asking for the thing each class uniquely knows. The utility
# phrases target the `power` track, which is the one this database is worst at
# and the one it refuses to infer; the contractor phrases target backlog, which
# leads energisation and is the closest thing here to a forward indicator.
#
# A kind with no entry keeps the base list.
[search.by_kind]
utility = [
  "\"data center\"",
  "\"large load\"",
  "\"interconnection agreement\" \"data center\"",
  "\"load interconnection\"",
  "\"energization\" \"data center\"",
]
contractor = [
  "\"data center\"",
  "\"backlog\" \"data center\"",
  "\"remaining performance obligations\" \"data center\"",
]

# 10-K and 10-Q together were 97% of hits in testing, and they are where the
# facts live: investment in the cash-flow statement, in-service dates in MD&A,
# tenant names in the ASC 842 lease footnotes. 8-K catches the announcement of a
# single large lease, which is exactly the customer-attribution fact we want.
forms = ["10-K", "10-Q", "8-K"]
