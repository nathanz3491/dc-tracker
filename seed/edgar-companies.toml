# --- Utilities ---------------------------------------------------------------
#
# The power company is the one counterparty that cannot be bypassed, and its
# filings say things no operator press release does: how much large load has
# actually signed an interconnection agreement, what the queue position is, and
# when energisation is expected. `power` is the track this database is worst at
# and the one it refuses to infer from construction, so this is aimed squarely at
# the gap rather than at more of what already works.
#
# CHOSEN BY MEASURED EXPOSURE, not by size. Each of these serves a state holding
# at least ~1% of tracked capacity, worst first: TX 33.8%, CO 11.7%, NM 8.5%,
# OH 8.4%, GA 7.8%, VA 7.8%, AZ 1.3%, OR 1.1%. A utility for a state with no
# tracked projects would be a subscription to noise.

[[company]]
