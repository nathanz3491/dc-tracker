# Phrases handed to full-text search, ANDed with the company scope above.
#
# Kept broad on purpose. Precision comes from `ciks`, so a narrow phrase only
# costs recall — "data center" against one company's filings is already precise.
#
# The lease phrases are here for a specific measured gap. After two rounds of
# ingestion only 30% of projects could be attributed to a buyer at all, and the
# unattributed remainder is almost entirely wholesale developers building for
# somebody they have not named in the press. A lease disclosure is the one public
# document that does name the counterparty, so these phrases target the single
# weakest field rather than adding more of what already works.
[search]
phrases = [
  "\"data center\"",
  "\"data centre\"",
  "\"lease agreement\" \"data center\"",
  "\"anchor tenant\"",
  "\"build-to-suit\"",
]

# 10-K and 10-Q together were 97% of hits in testing, and they are where the
# facts live: investment in the cash-flow statement, in-service dates in MD&A,
# tenant names in the ASC 842 lease footnotes. 8-K catches the announcement of a
# single large lease, which is exactly the customer-attribution fact we want.
forms = ["10-K", "10-Q", "8-K"]
