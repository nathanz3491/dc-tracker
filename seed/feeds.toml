[[sitemap]]
name = "utilitydive-archive"
url = "https://www.utilitydive.com/sitemap.xml"
source_type = "trade_press"
# NOT topic_implied: Utility Dive covers the whole power sector, so a headline
# must still say "data center" (or similar) to be about one of these projects.
topic_implied = false
# An index of MONTHLY archives, newest first, going back years — so max_children
# is a reach-back window in months rather than a handful of section files. The
# first two children are the footer and topic listings, which match nothing and
# cost two fetches. 26 therefore reaches roughly two years back.
#
# Measured: 75 matching URLs, of which 0 covered an already-tracked project. So
# this buys BREADTH (utility-side coverage of new projects and of grid obstacles)
# and not depth. If the queue is already long, --skip it.
max_children = 26
max_urls = 20000
