[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc-tracker"
version = "0.1.0"
description = "Ingest, normalize and query US data center construction projects with per-fact source citations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nathan Zhou" }]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    # `tracker tui`. A required dependency rather than an extra, because the TUI is
    # one of the three interfaces this project offers and an interface behind an
    # install flag is one nobody on the host has. It brings four small pure-Python
    # packages and Rich, which was already here.
    #
    # `tracker/tui/__init__.py` still imports it lazily: the deployer refuses a
    # commit that does not import, so a host whose dependency sync has not run yet
    # must be able to take the code and keep serving the console.
    "textual>=1.0",
]

[project.optional-dependencies]
# ISO queue readers. PJM exports .xls/.xlsx and CAISO/ERCOT publish .xlsx, so
# plain csv is not enough for the real files.
iso = ["openpyxl>=3.1"]
# A browser's TLS fingerprint, for hosts whose WAF blocks on the handshake
# rather than on the User-Agent. Measured: five URLs from one live `enrich` run
# answered 403 to httpx and 200 to curl with the SAME User-Agent, and every one
# of them returns 200 here. Cheap (one request, no browser), so it is the first
# escalation rung and needs no flag. Their robots.txt permits us — this clears
# an over-broad WAF rule, it does not defeat anybody's access control.
impersonate = ["curl_cffi>=0.7"]
# Browser-based fetching, used only as escalation for 403 / JS-rendered pages.
# Heavy (~33 transitive deps + a Chromium download via `crawl4ai-setup`), which
# is exactly why it is optional rather than required. Still earns its place
# above `impersonate`: the Meta/Blue Owl press release returns 200 and 106
# characters to curl_cffi, being a shell that assembles itself in the browser.
crawl = ["crawl4ai>=0.9"]
# Reader view for the console's sources page. Ten of the fifteen most-cited
# publishers refuse to be framed, so the modal renders our own extraction of the
# article — the arc90/Mozilla Reader View algorithm, which is what every
# read-later tool converged on for exactly this problem. Optional because it is
# purely display: nothing in the pipeline reads it, and a console without it
# falls back to the stored text.
reader = ["readability-lxml>=0.8", "lxml>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "openpyxl>=3.1",
    "readability-lxml>=0.8",
]

[project.scripts]
tracker = "tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]
# Data the runtime reads, not just repo files — and all of it lives INSIDE the
# package for one reason: a wheel contains `tracker/` and nothing else. `migrations/`
# and `seed/` used to sit at the repo root, so a non-editable install had no
# migrations to apply and `tracker init` failed before it could create anything.
# The console's static assets are listed for the same reason, and because
# hatchling honours VCS ignore rules: `.gitignore` carries unanchored `dist/`,
# `build/` and `.cache/` patterns, so a vendored file under a directory with one
# of those names would be silently absent from the wheel. The vendor tree is
# flattened to avoid that, and this is the belt to that pair of braces.
artifacts = [
    "tracker/prompts/*.txt",
    "tracker/webui/static/**",
    "tracker/migrations/*.sql",
    "tracker/seed/*",
    "tracker/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A fresh clone with no API key and no network must produce a green run.
addopts = "-q -m 'not network and not llm'"
markers = [
    "network: hits the real internet; deselected by default",
    "llm: spends real MiniMax tokens; deselected by default",
]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tracker.*"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # typer's Option()/Argument() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# RUF001 flags "ambiguous" unicode characters. In these files the curly quotes,
# dashes and non-breaking spaces ARE the subject: they are the characters we fold
# to ASCII when normalizing scraped text and repairing LLM replies. Renaming them
# to their ASCII lookalikes would delete the behaviour.
"tracker/normalize.py" = ["RUF001"]
"tracker/llm.py" = ["RUF001"]
"tracker/ingest/crawl.py" = ["RUF001"]
"tracker/ingest/fetch.py" = ["RUF001"]
"tests/test_normalize.py" = ["RUF001"]
"tests/test_ingest_crawl.py" = ["RUF001"]
# Same again for the reader: `_demojibake` exists to turn "Cote dâ€™Ivoire"
# back into "Cote d’Ivoire", so the tests have to name both spellings.
"tests/test_webui.py" = ["B011", "RUF001"]
