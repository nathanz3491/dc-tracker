# Headlines that match the tiers above but are reliably not project news. Any hit
# drops the item, before the other tiers are consulted.
#
# Tuned against a real discovery run: these categories accounted for most of the
# false positives. Kept categorical rather than headline-specific, so the list
# does not silently overfit to whatever was in the news the day it was written.
# Because an exclusion wins outright, each is the narrowest form that still names
# its category: a whole word that also appears in project news is not used.
#
# Geographic noise (a data center in Islamabad or Johor Bahru) is deliberately NOT
# filtered here. Judging a country from a headline is unreliable, and the crawl
# path already drops any project whose state will not normalize to a US code -- so
# a non-US article costs one LLM call and is then discarded correctly, which is
# better than a keyword rule that also throws away real US projects.
exclude = [
  # --- Commentary and analysis rather than an announcement ---
  # "explainer" and "lessons" from the old bank are left out: both cut pages that
  # produced a project ("Lessons for Delaware's future found in Virginia's data
  # center alley", "/explainers/what-does-switch-do-las-vegas").
  "opinion", "letter to the editor", "letters to the editor", "editorial",
  "commentary", "podcast*", "webinar*", "roundup", "how to", "what is", "signal for",
  "myths", "debunk*", "tips", "year in review",
  # A vendor's advice column on "your AI project" is not a project ("Pretraining vs.
  # Fine-Tuning vs. RAG: What's Best for Your AI Project?", CoreWeave's blog).
  "your ai project*", "best for your ai",
  # --- Market research, not a project ---
  # "annual report" was proposed and left out: the reports it matched were Illinois's
  # data-center incentive program reports, which list certified campuses.
  "forecast", "outlook", "market size", "market report*", "market research",
  "market to reach", "market landscape*", "research report*", "cagr", "predictions",
  "pegs us", "ranking", "sustainability report*", "esg report*", "impact report*",
  "environmental social and governance",
  # --- Events ---
  # Bare "summit" cut Summit County and bare "conference" would cut a governor's
  # press conference, so events are named by their other words. Bare "expo" cut a
  # job-fair story about construction hiring at Amazon's campus. The last six are
  # the industry circuit operators announce speakers at; "Advancing Data Center
  # Construction" alone was 13 rows (Sabey's speaker notices and the event's own
  # pages, which search keeps finding). "to speak at" and "to present at" were
  # proposed and left out: "Hundreds sign up to speak at data center hearing" is the
  # same phrase. "data center summit" was left out too: it is also the start of a
  # "/data-center-summit-county-..." slug.
  "summit 20*", "summits", "trends summit", "conference 20*", "conferences",
  "conference and expo", "conference expo", "technology conference*",
  "investment conference", "annual conference", "developer conference",
  "conference call", "expo 20*", "exhibitor*", "industry event*", "roundtable*",
  "register now", "data center world", "data centre world", "leadership summit",
  "safety summit", "dcd connect", "nanog*", "advancing data center construction",
  "advancing data center design",
  # --- Awards and rankings ---
  # Bare "awards" is left out: "County awards contract for data center" is news.
  "award winner*", "award finalist*", "awards 20*", "awards gala", "awards ceremony",
  "wins award", "entrepreneur of the year", "project of the year", "global awards",
  "impact awards", "top workplace*", "great place to work", "inc 5000",
  "fastest growing compan*",
  # --- Finance coverage ---
  # Bare "stock" and "shares" were exclusions in the substring bank; "stock" cut
  # Stockton, and "shares" would cut "TeraWulf shares new information about data
  # center planned in Hawesville". Stock coverage is named by what it says about
  # the price. Bare "earnings" is left out too: earnings-call pages are where
  # several miners first named a new site, and 11 of them produced a project.
  # "instant alerts" is MarketBeat's fund-filing section ("Fairtree Asset Management
  # takes 462000 position in Equinix Inc"), eight pages, all noise. Bare "position
  # in" was proposed for them and left out: "strengthens its position in Northern
  # Virginia" is expansion news.
  "earnings call transcript", "earnings preview", "earnings date", "financial results",
  "operational update*", "price target*", "target price*", "analyst", "analysts",
  "outperform", "overweight", "underweight", "buy point", "buy rating",
  "initiates coverage", "stock price*", "share price*", "stock of the day",
  "stocks to buy", "stocks to watch", "best stocks", "data center stock*",
  "stock holdings", "cash dividend*", "stock dividend*", "quarterly dividend*",
  "declares dividend", "etf", "etfs", "new position in", "boosts position",
  "shareholder alert", "lead plaintiff", "securities class action", "misled investors",
  "stock rises", "stock rose", "stock jumps", "stock jumped", "stock soars",
  "stock soared", "stock surges", "stock surged", "stock falls", "stock fell",
  "stock drops", "stock dropped", "stock plunges", "stock plunged", "stock tumbles",
  "stock slides", "stock sinks", "stock climbs", "stock gains", "stock slips",
  "stock rallies", "shares rise", "shares rose", "shares jump", "shares jumped",
  "shares soar", "shares soared", "shares surge", "shares surged", "shares fall",
  "shares fell", "shares drop", "shares dropped", "shares plunge", "shares plunged",
  "shares tumble", "shares slide", "shares sink", "shares climb", "shares gain",
  "shares slip", "shares rally", "instant alerts",
  # --- Pure crypto mining ---
  # The substring bank dropped every headline containing "bitcoin" or "crypto mine",
  # which threw away the mine-to-AI conversions ("TeraWulf converts Lake Mariner
  # bitcoin mining site to AI data center"). Pure mining news is named by what only
  # it reports: production, hashrate in EH/s, holdings, the halving. A miner's
  # headline that says neither "data center" nor "AI" fails the topic tier anyway.
  "bitcoin production", "monthly production", "production update*", "mining update*",
  "exahash*", "eh s", "hashprice", "bitcoin price*", "btc price*", "bitcoin treasury",
  "bitcoin holdings", "btc holdings", "btc mined", "bitcoin mined", "halving",
  "stablecoin*", "crypto trading",
  # --- Recruiting and executive moves ---
  # Bare "jobs" and "hiring" are no longer here: "creating 100 jobs" and "electrical
  # contractor for new Facebook data center in Mesa hiring 500" are project news.
  # "officer" is every "chief ... officer" appointment and the job listings for
  # security officers; no kept headline used it otherwise. The "as <title>" forms
  # catch the welcomes that "officer" misses ("Vantage Data Centers welcomes Jeremy
  # Deutsch as President of APAC"), which is what lets "welcome*" stay a signal for
  # a town that welcomes a campus.
  "careers", "career opportunit*", "job opening*", "job spotlight", "job details",
  "browse jobs", "technician jobs", "salary", "job cuts", "appoint*",
  "board of directors", "board director*", "to step down", "steps down",
  "vice president", "officer", "managing director", "senior leadership",
  "leadership post", "employee spotlight*", "as president of", "as svp", "as new svp",
  "as evp", "as cfo", "as ceo", "as coo", "as cto", "as chief",
  # --- Compliance certifications ---
  # An operator's audit and certification notices ("DataBank completes annual PCI DSS
  # audits for all Texas facilities", "Vantage awarded ISO 27001 certification"):
  # about 25 newsroom pages. Bare "certification" is not used: it would cut
  # "EdgeCore announces expansion of Greater Phoenix data center campus", whose
  # release mentions one, and bare "fedramp" would cut a new government cloud region.
  "ssae*", "hipaa", "pci dss", "soc 2", "iso 27001", "fedramp authorization",
  "fedramp certif*", "fedramp compliant",
  # --- Community programmes ---
  # Sponsorships an operator announces in its newsroom ("New scholarship to offer at
  # least $10,000 to Bessemer City High School graduates"): about a dozen pages.
  # "donat*" and "sponsor" are not used: "Compass Datacenters donates training
  # facility to Texas State Technical College" and a sponsor story about Pataskala
  # produced projects.
  "scholarship*", "robotics competition*", "robotics team*", "first robotics",
  # --- Sections of a site that are structurally not project news ---
  # `normalize_haystack` turns the URL path's slashes and hyphens into spaces, so a
  # two-word term matches a path segment pair. That is what makes these safe: a bare
  # "resources" would drop `databank.com/resources/news/...`, which is real press,
  # while "resources blogs" only ever matches the blog shelf.
  #
  # These are measured against the live queue rather than guessed at. When 1,241
  # candidates had accumulated, site sections accounted for 260 of them: 103
  # DataBank compliance blogs, 62 sponsored posts, 60 NTT marketing articles, 18
  # executive roundtables (now under Events). Each would have cost an extraction
  # call to discover it says nothing about any specific project. "logo", "copy of",
  # "siterendering" and "website construction" are the image-attachment pages of
  # Meta's data-center sitemap.
  #
  # "ebook" is safe now that terms match whole words from the start: it no longer
  # matches inside "facebook". Left out on measurement: "case studies" (a
  # contractor's case study names the campus; four produced a project), "en us
  # services" (NTT's facility pages live under it; eleven produced a project) and
  # "en us insights" (its NTT blog shelf is closed with the sitemap, and the one
  # headline it still dropped was "Cleaner Air Oregon program clears new Hillsboro
  # data center for construction").
  "resources blogs", "en us accounts", "en us industries", "en us about us",
  "sponsored", "voices of the industry", "white paper*", "whitepaper*", "ebook*",
  "spec sheet*", "datasheet*", "data sheet*", "prospectus", "press kit*", "media kit*",
  "privacy policy", "glossary", "data center chips", "logo", "copy of",
  "siterendering*", "website construction*",
]


# ---------------------------------------------------------------------------
# Sitemaps, walked every night by `tracker discover` (and in full by `tracker sync --deep`).
#
# A feed shows only what published in the last few days, so a project announced
# in 2023 never appears in one. Sitemaps solve that without any API key: they
# list a site's whole archive, they carry lastmod dates, and they exist
# specifically so machines can read them. datacenterfrontier's article sitemaps
# hold ~3,400 URLs going back to 2015, of which ~790 match the filter.
#
# `max_children` limits how many child sitemaps are fetched when the URL is an
# index; article sitemaps are preferred over Company/Event/Contact ones, which
# can never describe a project.
[[sitemap]]
name = "datacenterfrontier-archive"
url = "https://www.datacenterfrontier.com/sitemap.xml"
source_type = "trade_press"
topic_implied = true
max_children = 3
# CLOSED with the feed of the same site, see the top of this file.
closed = "2026-10-02: Cloudflare challenge on the sitemap index, every article and robots.txt"

# Adding archives is the key-free way to widen coverage, and it is usually a
# better buy than a search key: no account, no card, no CAPTCHA, no quota. With
# only datacenterfrontier configured, 17 of 94 tracked projects had an unread
# archive article and 77 had none — the corpus, not the budget, was the ceiling
# on `tracker enrich`.

# ---------------------------------------------------------------------------
# Operator newsrooms.
#
# A press release is `company_filing` (weight 3) and opens with the three fields
# that are hardest to find anywhere else: "X announces a $N billion campus, online
# in YEAR". Measured across the whole database, trade press yields 0.57 of those
# three fields per citation; the two company sources in it yield 1.50.
#
# `company` marks the entry as an operator's OWN newsroom. Everything on
# stackinfra.com is published by STACK, so `matches_known_project` need not find
# the company in the slug as well — measured, dropping that redundant requirement
# took the yield from 15 articles over 8 projects to 28 over 13, because a release
# titled "New Hillsboro campus announced" names the city and not the company.
# It also tells `classify_source_type` that the host is first-party, which it
# cannot otherwise tell for `www.operator.com/news/...`.
#
# Not listed, and why: QTS 404s, Flexential and Iron Mountain answer 403/429, and
# STACK, Switch, Vantage, EdgeConneX and news.microsoft.com serve their child
# sitemaps only to browser-like clients (curl gets 200, httpx gets 403 on the same
# URL — a TLS-fingerprint rule). Their robots.txt explicitly permits crawling and
# advertises the sitemap, so those are reachable with `--browser` once the
# `[crawl]` extra is installed; they are left out rather than failing every run.

# `topic_implied` is true ONLY for pure-play operators, whose every page really is
# about a data center. It is false for diversified companies even though the
# newsroom is theirs: Meta's publishes Instagram teen-safety settings and "Facebook
# Campus", a social product whose name matches the `campus` project signal, and
# NTT's covers a whole telecom business. Measured with it wrongly set true, a
# 120-article batch read Meta product announcements and NTT service pages, and 101
# of 163 URLs produced no project at all.
[[sitemap]]
name = "meta-newsroom-archive"
url = "https://about.fb.com/sitemap.xml"
source_type = "company_filing"
company = "Meta"
topic_implied = false
max_urls = 20000

# Meta's dedicated data-center site: one page per campus plus a news archive
