# Added 2026-08-01 to break a single-outlet dependency. Measured before adding:
# 130 of ~180 editorial citations came from datacenterfrontier.com, and 109 of
# 124 projects rested on ONE domain — which caps them below confidence 3, since
# `confidence.compute` requires two independent registrable domains.
#
# Every entry below was fetched and parsed with this file's own filter before
# being added; the match count in each comment is what `discover` really saw on
# one poll, not an estimate.

[[feed]]
name = "bisnow-latest"
# Replaces `bisnow-datacenter`, the data-center vertical's own feed, which is gone.
# That one matched 11 of 30 entries, the highest hit rate of anything tested, and
# was the only feed that reliably carried the LOCAL government story: county
# moratoria, rezoning votes, approvals — the `permitting` and
# `community_opposition` risk categories, at 2 rows each when it was added.
#
# Bisnow has since moved to a new site. The last row the old feed queued is dated
# 2026-08-01, and on 2026-10-02 `/rss/data-center` redirects to a 404. The one
# feed it still serves is this: its nine newest stories across every market and
# property type, with no paging and no way to ask for one vertical. Its sitemap
# lists section pages and monthly HTML indexes, nothing a feed parser can read.
# So a daily poll sees only the stories published last, and on the poll that
# added it none of the nine was a data center.
#
# Kept anyway, on the rule the state newsrooms below were added on: one request a
# night, nothing spent until an article matches, and what it can catch is what
# trade press skips. Not topic_implied, since it covers offices and retail too.
# The vertical is in the URL (`/news/<market>/data-center-development/<slug>`)
# and the filter reads the URL path, so a data-center story passes the topic tier
# even when its headline never says so. Its articles are served normally.
