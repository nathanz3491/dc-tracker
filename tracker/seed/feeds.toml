# Feeds that `tracker discover` polls for new data center project articles.
#
# Operator-editable: add or remove entries here without touching code. Override
# the file entirely with `tracker discover --feeds PATH`.
#
# Set `topic_implied = true` for an outlet that only ever covers data centers:
# the topic keyword tier is then presumed satisfied and the project signal alone
# decides, so a headline like "Crusoe expands Abilene campus to 1.2GW" is kept
# even though it never says "data center".
#
# `source_type` is a hint recorded on the queued candidate. The crawl path
# re-derives the real source_type from the article URL, so a wrong hint here
# affects triage display only, never a stored confidence score.
#
# Every URL below is verified to fetch and parse; a feed that stops resolving is
# reported by `tracker discover` rather than failing the run.
#
# `closed = "why"` keeps an entry here but stops it being requested — a feed is
# not polled and an archive is not walked. It is for a publisher that has since
# refused every client this project is willing to be, so a request can only fail;
# the reason says what was measured and when. `tracker discover` counts these as
# "feeds closed", apart from "feeds failed", so that line still means something
# broke since this file was last edited.
#
# Closed rather than deleted, for two reasons. `tracker feeds` proposes any
# publisher whose citations decide stored values and that this file does not list,
# so a deleted datacenterfrontier would head its list of feeds to add for good. And
# a block can lift: the URL, the filter setting and the reasoning are still here
# when it does, and re-opening is deleting one line.
#
# --- Closed to clients that cannot run JavaScript, measured 2026-10-02 -------
#
# Thirteen feeds and one archive answer 403 as of 2026-10-02: datacenterdynamics,
# datacenterfrontier (feed and archive) and all eleven States Newsroom sites. The
# newest rows they queued are dated 2026-09-22 and 2026-09-25, so the blocks are
# recent. Each answers with Cloudflare's "Just a moment..." page and a
# `cf-mitigated: challenge` header, which `tracker discover` names in its failure
# line. That page is a challenge: it lets through only a client that runs the
# site's own detection script.
#
#   * Every page, not only the feed: homepage, articles and, on the States
#     Newsroom sites, the WordPress API. datacenterdynamics and datacenterfrontier
#     challenge even robots.txt.
#   * Identical for our User-Agent, for httpx's default, for a Chrome User-Agent
#     and for a feed reader's, so it is not a User-Agent filter.
#   * Identical through curl, and through curl_cffi presenting Chrome's and
#     Safari's TLS fingerprints, so it is not the fingerprint rule the article
#     fetcher's curl_cffi rung exists for.
#   * A 403 from a second, unrelated network as well, so it is not our address.
#     Other Cloudflare sites in this file — datacenterknowledge, utilitydive,
#     constructiondive, news.microsoft.com — serve the same client normally, so
#     the setting is each publisher's own.
#
# Getting past it means passing the publisher's bot detection, which is the access
# control itself rather than a rule misfiring, and this project does not do that —
# docs/ingesting.md, "Why DataCenterDynamics is not read". Rows these feeds queued
# before the block are still in the queue, and their pages answer the same
# challenge: only the ones whose syndicated body was cached when they were queued
# can be read.
#
# To see whether one has re-opened — 200 means delete its `closed` line, then run
# `tracker discover --dry-run` to see what it would queue:
#
#   curl -s -o /dev/null -w '%{http_code}\n' https://georgiarecorder.com/feed/

[[feed]]
name = "datacenterdynamics"
# Covers nothing but data centers, so the topic tier is presumed satisfied
# and the project signal alone decides. See FeedSpec.topic_implied.
topic_implied = true
#
# CLOSED, see the top of this file. Until 2026-09-25 this was DISCOVERY ONLY: the
# feed was served freely while the article pages sat behind Cloudflare bot
# management, returning 403 to any non-browser client -- verified identical for our
# UA, no UA, and curl, so not a User-Agent filter. It stayed enabled because the
# headlines were still valuable: they say WHICH projects exist, and the facts can
# be taken from the operator's own release or another outlet. Now the feed answers
# the same challenge as the articles, so there is nothing left here to read.
#
# Their robots.txt set `Content-Signal: search=yes,ai-train=no,use=reference`.
# We do not train on the content and we store only short attributed excerpts, but
# the Cloudflare block is a deliberate access control and this project does not
# try to defeat it. See docs/ingesting.md "Why DataCenterDynamics is not read".
closed = "2026-10-02: Cloudflare challenge on the feed, every article and robots.txt"
url = "https://www.datacenterdynamics.com/en/rss/"
source_type = "trade_press"

[[feed]]
name = "datacenterfrontier"
# Covers nothing but data centers, so the topic tier is presumed satisfied
# and the project signal alone decides. See FeedSpec.topic_implied.
topic_implied = true
# A sitemap, not RSS: this site publishes no working feed. /rss/, /feed/ and
# /rss.xml all 404, and /?feed=rss2 returns an HTML error page with HTTP 200.
# /sitemap.xml is a sitemap *index*, so point straight at the article sitemap —
# it is ordered newest-first and carries real lastmod dates, which is all the
# age filter needs. Titles come from the URL slug.
#
# CLOSED, see the top of this file. The most-cited publisher in the database, so
# its rows are where this block costs most: 522 of its articles were still queued
# on 2026-10-02, and their pages answer the same challenge.
closed = "2026-10-02: Cloudflare challenge on the sitemap, every article and robots.txt"
url = "https://www.datacenterfrontier.com/sitemap/Article.xml"
source_type = "trade_press"

[[feed]]
name = "datacenterknowledge"
# Covers nothing but data centers, so the topic tier is presumed satisfied
# and the project signal alone decides. See FeedSpec.topic_implied.
topic_implied = true
# The highest-yield feed here: 50 entries per poll, of which ~22 match, and unlike
# datacenterdynamics its *articles* are fetchable over plain HTTP.
url = "https://www.datacenterknowledge.com/rss.xml"
source_type = "trade_press"

