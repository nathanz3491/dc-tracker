# Keyword filtering is two-tier, and both tiers must match.
#
# `topic` establishes that the article is about a data center at all. `signal`
# establishes that it concerns a specific PROJECT rather than industry commentary
# — an opinion piece about AI power demand matches `topic` but has no project to
# extract, and would waste an LLM call.
[filter]
topic = [
  "data cent",
  "datacent",
  "hyperscale",
  "colocation",
  "compute campus",
  "ai campus",
  "ai factory",
  "gigafactory",
]
signal = [
  "megawatt",
  " mw",
  "gigawatt",
  " gw",
  "billion",
  "bn",
  "million",
  "campus",
  "break ground",
  "breaks ground",
  "groundbreaking",
  "announce",
  "expansion",
  "expand",
  "invest",
  "build",
  "construct",
  "site",
  "facility",
  "plans",
]

# A third tier, and the second way to satisfy `signal`.
#
# Every term above is announcement-shaped, which silently threw away every article
# about a project going WRONG. Measured against the real filter, all of these were
# dropped for having "no project signal":
#
#   Loudoun supervisors reject data center rezoning application
#   Georgia Power says transmission upgrades delay data center energization
#   Transformer shortage pushes back hyperscale data center timelines
#   Moratorium halts new data center development in Fayetteville
#   Water use concerns stall Tucson data center vote
#
# So the corpus the extractor ever saw was announcements only, and no schema change
# recovers an obstacle from an article that was never queued. A term here satisfies
# the signal tier on its own, but `topic` above must still match — a transformer
# shortage at a steel mill is still dropped.
#
# This is NOT a lever for `blocker` coverage. Most projects genuinely have no
# blocker (see tracker/gaps.py, which reports the field as unmeasurable for exactly
# that reason). The point is to stop discarding the articles where one is real.
risk_signal = [
  # Schedule
  "delay",
  "delayed",
  "postpone",
  "pause",
  "paused",
  "halt",
  "stalled",
  "scrapped",
  # Government and legal. "permit" and "zoning" are knowingly broad — they match
  # approvals as well as refusals — but permitting is itself one of the risk
  # categories, and the queue is a triage checkpoint where over-collecting is
  # cheaper than a keyword rule that drops real obstacles.
  "moratorium",
  "lawsuit",
  # Padded, like " mw" in the signal tier above. `normalize_haystack` surrounds the
  # haystack with spaces and terms are plain substrings, so a bare "sue" matches
  # inside "issued" — which put "PJM Issued First Backup-Generator Warnings" in the
  # queue on a live run.
  " sue ",
  " sues ",
  " sued ",
  "permit",
  "zoning",
  "rezoning",
  # A county granting or refusing a tax abatement is the public decision that
  # most often precedes a campus, and the vote is reported where the
  # announcement is not. Added for the `abatement` search template, which was
  # measured producing nothing at all without it: "Maricopa County Arizona data
  # center tax abatement approved" matched the topic tier and no signal, so
  # every hit was discarded before it cost a fetch — and a template that queues
  # nothing is invisible in `tracker queue stats`, indistinguishable from one
  # that never ran.
  #
  # This widens the queue for every feed and sitemap, not only for search. The
  # topic tier is what bounds it: "Ohio steel mill wins tax abatement" and
  # "Asbestos abatement contract awarded" are both still dropped, because
  # neither says data center. "noise abatement" already matched via "noise".
  "abatement",
  "referendum",
  "denied",
  "rejected",
  "appeal",
  "challenge",
  "injunction",
  # Community and environment
  "opposition",
  "oppose",
  "protest",
  "noise",
  "water use",
  "aquifer",
  "groundwater",
  "emissions",
  "air quality",
  # Power
  "transformer",
  "substation",
  "interconnection",
  "transmission",
  "curtail",
  "grid capacity",
  "tariff",
  # Commercial
  "financing",
  "anchor tenant",
  "offtake",
  "shortage",
  "supply chain",
]

# Headlines that match the tiers above but are reliably not project news.
#
# Tuned against a real discovery run: these categories accounted for most of the
# false positives. Kept categorical rather than headline-specific, so the list
# does not silently overfit to whatever was in the news the day it was written.
#
# Geographic noise (a data center in Islamabad or Johor Bahru) is deliberately NOT
# filtered here. Judging a country from a headline is unreliable, and the crawl
# path already drops any project whose state will not normalize to a US code — so
# a non-US article costs one LLM call and is then discarded correctly, which is
# better than a keyword rule that also throws away real US projects.
exclude = [
  # Commentary and analysis rather than an announcement
  "opinion",
  "podcast",
  "webinar",
  "roundup",
  "explainer",
  "how to",
  "what is",
  "lessons",
  "signal for",
  # Market research, not a project
  "forecast",
  "outlook",
  "market size",
  "predictions",
  "pegs us",
  # Events and recruiting
  "jobs",
  "hiring",
  "careers",
  "job cuts",
  "summit",
  "conference",
  "expo",
  "awards",
  # Finance coverage
  "earnings call transcript",
  "stock",
  "shares",
  "analyst",
  "etf",
  # Adjacent industries that match the keywords but are not data centers
  "cryptomine",
  "crypto mine",
  "bitcoin",
  # Sections of a site that are structurally not project news.
  #
  # `normalize_haystack` turns the URL path's slashes and hyphens into spaces, so
  # a two-word term matches a path segment pair. That is what makes these safe: a
  # bare "resources" would drop `databank.com/resources/news/...`, which is real
  # press, while "resources blogs" only ever matches the blog shelf.
  #
  # Every one of these is measured against the live queue rather than guessed at.
  # 1,241 candidates had accumulated, and these accounted for 260 of them: 103
  # DataBank compliance blogs, 62 sponsored posts, 60 NTT marketing articles, 18
  # executive roundtables. Each would have cost an extraction call to discover it
  # says nothing about any specific project.
  #
  # "ebook" was tried and rejected: it matches inside "facebook", which is the same
  # trap the padded " sue " above documents.
  "resources blogs",
  "en us insights",
  "en us services",
  "en us accounts",
  "en us industries",
  "en us about us",
  "case studies",
  "sponsored",
  "roundtable",
  "voices of the industry",
  "white paper",
  "whitepaper",
  "spec sheets",
]


# ---------------------------------------------------------------------------
# Sitemaps, walked by `tracker sync --deep`.
#
# A feed shows only what published in the last few days, so a project announced
# in 2023 never appears in one. Sitemaps solve that without any API key: they
# list a site's whole archive, they carry lastmod dates, and they exist
# specifically so machines can read them. datacenterfrontier's article sitemaps
# hold ~3,400 URLs going back to 2015, of which ~790 match the filter.
#
# `max_children` limits how many child sitemaps are fetched when the URL is an
# index; article sitemaps are preferred over Company/Event/Contact ones, which
# can never describe a project.
[[sitemap]]
name = "datacenterfrontier-archive"
url = "https://www.datacenterfrontier.com/sitemap.xml"
source_type = "trade_press"
topic_implied = true
max_children = 3
# CLOSED with the feed of the same site, see the top of this file.
closed = "2026-10-02: Cloudflare challenge on the sitemap index, every article and robots.txt"

# Adding archives is the key-free way to widen coverage, and it is usually a
# better buy than a search key: no account, no card, no CAPTCHA, no quota. With
# only datacenterfrontier configured, 17 of 94 tracked projects had an unread
# archive article and 77 had none — the corpus, not the budget, was the ceiling
# on `tracker enrich`.

# ---------------------------------------------------------------------------
# Operator newsrooms.
#
# A press release is `company_filing` (weight 3) and opens with the three fields
# that are hardest to find anywhere else: "X announces a $N billion campus, online
# in YEAR". Measured across the whole database, trade press yields 0.57 of those
# three fields per citation; the two company sources in it yield 1.50.
#
# `company` marks the entry as an operator's OWN newsroom. Everything on
# stackinfra.com is published by STACK, so `matches_known_project` need not find
# the company in the slug as well — measured, dropping that redundant requirement
# took the yield from 15 articles over 8 projects to 28 over 13, because a release
# titled "New Hillsboro campus announced" names the city and not the company.
# It also tells `classify_source_type` that the host is first-party, which it
# cannot otherwise tell for `www.operator.com/news/...`.
#
# Not listed, and why: QTS 404s, Flexential and Iron Mountain answer 403/429, and
# STACK, Switch, Vantage, EdgeConneX and news.microsoft.com serve their child
# sitemaps only to browser-like clients (curl gets 200, httpx gets 403 on the same
# URL — a TLS-fingerprint rule). Their robots.txt explicitly permits crawling and
# advertises the sitemap, so those are reachable with `--browser` once the
# `[crawl]` extra is installed; they are left out rather than failing every run.

# `topic_implied` is true ONLY for pure-play operators, whose every page really is
# about a data center. It is false for diversified companies even though the
# newsroom is theirs: Meta's publishes Instagram teen-safety settings and "Facebook
# Campus", a social product whose name matches the `campus` project signal, and
# NTT's covers a whole telecom business. Measured with it wrongly set true, a
# 120-article batch read Meta product announcements and NTT service pages, and 101
# of 163 URLs produced no project at all.
[[sitemap]]
name = "meta-newsroom-archive"
url = "https://about.fb.com/sitemap.xml"
source_type = "company_filing"
company = "Meta"
topic_implied = false
max_urls = 20000

# Meta's dedicated data-center site: one page per campus plus a news archive
