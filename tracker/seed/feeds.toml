[filter]
# Keyword filtering is two-tier, and both tiers must match.
#
# `topic` establishes that the article is about a data center at all. `signal`
# establishes that it concerns a specific PROJECT rather than industry commentary
# -- an opinion piece about AI power demand matches `topic` but has no project to
# extract, and would waste an LLM call.
#
# A term matches whole words; a term ending in `*` matches the start of a word
# ("announc*" is announces, announced, announcement). Terms are normalized like
# the haystack, so "we're" is "we re" and "data-center" is "data center".
#
# Recall is worth more than precision here: a kept headline costs about a
# hundredth of a yuan to read, and a dropped one is news lost for good.
topic = [
  # --- The facility itself ---
  # "data cent*" is "data center", "data centre" and their plurals. "data processing
  # use" and "data information processing" are how zoning codes and county agendas
  # name a data center when they avoid the phrase.
  "data cent*", "datacent*", "data hall*", "data campus*", "data project*",
  "ai data hub*", "data processing facilit*", "data processing cent*",
  "data processing use*", "data information processing", "hyperscal*", "colocat*",
  "colo", "co location*", "co located", "server farm*", "serverfarm*",
  "mission critical",
  # --- AI and compute campuses ---
  # An AI campus is often announced without the words "data center" (Crusoe, xAI's
  # Colossus, Microsoft's Fairwater, OpenAI's Stargate). The old bank's bare
  # "gigafactory" is narrowed to "ai gigafactor*" and xAI's "gigafactory of
  # compute": on its own it is Tesla's battery plants, which are not data centers.
  # "hpc*" is a stem because trade-press slugs fuse "HPC/AI" into "hpcai"; it matches
  # nothing else. "ai project*" is the weakest term here (one real headline, "PJM
  # plans to study SoftBank's Ohio AI project", against three that were not news of
  # a campus), kept because a missed project costs more than three reads.
  "ai campus*", "ai factor*", "ai gigafactor*", "ai hub*", "ai center*",
  "ai infrastructure", "infrastructure for ai", "ai capacity", "ai compute",
  "ai cloud", "supercomput*", "supercluster*", "compute campus*", "computing campus*",
  "compute cent*", "computing cent*", "computing facilit*", "compute capacity",
  "compute infrastructure", "computing infrastructure", "compute cluster*",
  "gpu cluster*", "ai cluster*", "hpc*", "high performance comput*", "neocloud*",
  "stargate", "colossus", "gigafactory of compute", "fairwater", "ai power plant*",
  "ai project*",
  # --- Capacity phrasing only data centers use ---
  # A gigawatt is said of a campus or of the power plant built for one ("TeraWulf's
  # Kentucky campus to reach 1GW in 2029", "Google signs 3.6GW deal with
  # Constellation"); "megawatt" alone is not here, because a 5 MW solar farm is not.
  # "campus" is how operators and trade press name a site without saying "data
  # center" ("Riot acquires additional 238 acres at Corsicana campus"): it kept 51
  # URL-only pages that produced a project. Its noise is university and office
  # campuses, which need a project signal as well. "gw", "gigawatt*" and "campus*"
  # are in `signal` too, so each keeps a headline on its own. "university campus" is
  # not excluded: an exclusion always wins, and would cut a data center on one.
  "mw campus*", "gw campus*", "megawatt campus*", "gigawatt campus*", "mw lease*",
  "megawatt lease*", "gw", "gigawatt*", "mw of ai", "gw of ai", "megawatts of ai",
  "gigawatts of ai", "campus*",
  # --- Campus codenames ---
  # A campus filed under a codename is reported under it, often without "data center"
  # ("Fermi announces $6.5B lease agreement at Project Matador", "Project Blue's
  # Billion-Dollar Secrecy"). Taken from the tracked projects' names and the
  # headlines that named them; a codename that surfaces later belongs here too.
  "polaris forge", "delta forge", "lake mariner", "hyperion", "prometheus", "supernap",
  "prince william digital gateway", "pw digital gateway", "project aquila",
  "project azalea", "project blue", "project camellia", "project caprock",
  "project cardinal", "project clydesdale", "project dorothy", "project double reed",
  "project eagle", "project hercules", "project horizon", "project hyper",
  "project iron spur", "project jupiter", "project kati", "project loch",
  "project marvel", "project matador", "project meriwether", "project merlin",
  "project morgan", "project nova", "project peanut", "project pegasus",
  "project rainier", "project red clay", "project ruby", "project sail",
  "project southgate", "project steamboat", "project tamarack", "project tango",
  "project tembo", "project washington", "project zodiac",
  # --- Pure-play data-center operators ---
  # Companies whose only business is data centers, so their name in a headline is
  # the topic ("Nebius x Independence, Missouri", "Applied Digital secures $5bn
  # hyperscaler lease"). They kept 105 URL-only pages that produced a project,
  # against about 70 financing and investor pages. Hyperscalers (Google, Amazon,
  # Microsoft, Meta, OpenAI, xAI) and miners or neoclouds (CoreWeave, Crusoe, IREN,
  # TeraWulf, Hut 8) are NOT here: their names alone kept hundreds of product
  # launches, earnings dates and mining reports, and their campus news says
  # "campus", a GW figure or "data center" anyway. "evoque" is left out: it is also a
  # Range Rover.
  "equinix", "digital realty", "cyrusone", "qts", "stack infrastructure", "cologix",
  "databank", "flexential", "sabey", "yondr", "edgecore", "novva", "cloudhq",
  "radiusdc", "dc blox", "element critical", "corscale", "quantum loophole",
  "applied digital", "nebius", "lancium", "fermi america", "rowan digital",
  "tierpoint",
  # --- Cloud and network buildings ---
  # "global network" is the section of Google's blog where it announces campuses.
  # Its URL path carries the phrase, and it is in the signal tier too, so every post
  # there is kept: some campus pages say nothing else
  # ("/global-network/data-center-pine-island/"). "cloud computing" was proposed and
  # left out: it names a market, not a building, and kept nothing the rest of this
  # tier did not.
  "cloud region*", "availability zone*", "cloud campus*", "cloud infrastructure",
  "digital infrastructure", "internet infrastructure", "carrier hotel*",
  "internet exchange*", "interconnection hub*", "global network",
  "amazon web services",
  # --- Crypto-mine-to-AI conversions ---
  # A miner turning a site into an AI campus is project news even when the headline
  # never says "data center" ("Bitcoin miner Core Scientific shifts to AI with
  # 1.5GW"). Pure mining news is still dropped: it says neither. In every corpus
