<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>dc-tracker console</title>

<!--
  Self-contained on purpose. Everything else the console serves — the app, the
  vendored bundles, the fonts — sits behind the gate, so this page cannot link to
  any of it. The styles below are the Meridian tokens copied inline rather than
  imported, which is a small duplication bought deliberately: it means an
  unauthenticated request reaches exactly one file and learns nothing about what
  is behind it.
-->
<style>
  :root {
    --background:#faf6ef; --surface:#fffdf8; --foreground:#2e2620; --muted:#f3ecdf;
    --muted-foreground:#6b5c4f; --border:#eae0d0; --input:#e0d3be; --ring:#a05e1c;
    --primary:#a05e1c; --primary-hover:#8a5115; --primary-foreground:#fffaf2;
    --danger:#b8433a; --danger-soft:#f9deda; --warning:#8a680a; --warning-soft:#f5ebc4;
    --dot:rgb(84 58 24 / 0.08);
    --sans:"Inter",ui-sans-serif,system-ui,sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background:#1b1410; --surface:#251b14; --foreground:#f3eadb; --muted:#2d231b;
      --muted-foreground:#b0a089; --border:#372a1f; --input:#423325; --ring:#dca75f;
      --primary:#dca75f; --primary-hover:#e9b87a; --primary-foreground:#2a1d0e;
      --danger:#e0806f; --danger-soft:rgb(224 128 111 / 0.14);
      --warning:#dfb75c; --warning-soft:rgb(223 183 92 / 0.14);
      --dot:rgb(255 230 200 / 0.06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--background); color:var(--foreground);
    font:400 14px/20px var(--sans);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.5px);
    background-size: 22px 22px;
  }
  .card {
    width:min(420px,100%); background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:28px 26px;
    box-shadow:0 4px 8px -2px rgb(84 58 24 / .08), 0 16px 40px -12px rgb(84 58 24 / .18);
  }
  /* Mark, wordmark and tag on one baseline. `display:block` on the mark is what
     puts it there: a block-level flex item has no baseline of its own, so flexbox
     aligns its bottom edge, landing the mark on the wordmark's baseline. It fills
     from --primary through currentColor, so this one copy serves both schemes. */
  .brand { display:flex; align-items:baseline; gap:11px; margin-bottom:4px; }
  .brand svg { display:block; flex:none; color:var(--primary); }
  .brand b { font:500 26px var(--serif); letter-spacing:-.015em; }
  .brand span { font:400 12px var(--mono); color:var(--muted-foreground); }
  h1 { margin:14px 0 6px; font:500 20px/1.3 var(--serif); letter-spacing:-.01em; }
  p.lede { margin:0 0 20px; color:var(--muted-foreground); line-height:20px; }
  label {
    display:block; margin-bottom:6px; font-size:12px; font-weight:500;
    text-transform:uppercase; letter-spacing:.08em; color:var(--muted-foreground);
  }
  input {
    width:100%; height:40px; padding:0 12px; font:400 15px var(--sans);
    color:var(--foreground); background:var(--background);
    border:1px solid var(--input); border-radius:10px; outline:none;
    transition:border-color 150ms, box-shadow 150ms;
  }
  input:focus { border-color:var(--ring); box-shadow:0 0 0 2px color-mix(in oklab,var(--ring) 25%,transparent); }
  button {
    width:100%; height:40px; margin-top:14px; border:0; border-radius:10px;
    font:500 14px var(--sans); color:var(--primary-foreground); background:var(--primary);
    cursor:pointer; transition:background 150ms;
  }
  button:hover:not(:disabled) { background:var(--primary-hover); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .msg {
    display:none; margin-top:14px; padding:10px 13px; border-radius:12px;
    font-size:13px; line-height:19px;
  }
  .msg--err  { display:block; background:var(--danger-soft);  color:var(--danger); }
  .msg--warn { display:block; background:var(--warning-soft); color:var(--warning); }
  .note {
    margin:20px 0 0; padding-top:16px; border-top:1px solid var(--border);
    font-size:12px; line-height:18px; color:var(--muted-foreground);
  }
  code { font-family:var(--mono); font-size:11px; }
  /* A button rather than an anchor: it switches this form's mode, it does not
     navigate, and an <a href="#"> that does not navigate is a lie to a screen
     reader and to the back button alike. */
  /* `width`, `height` and `margin-top` are reset explicitly: the `button` rule
     above makes every button a full-width 40px block, and a class that only
     overrode colour would leave this one shaped like the submit button. The
     `:hover` reset is there because `button:hover:not(:disabled)` outweighs a
     single class, so without it hovering the link paints it primary. */
  .linkish {
    display:inline-block; width:auto; height:auto; margin:0 0 6px; padding:0;
    border:0; background:none; font:inherit; color:var(--primary); cursor:pointer;
    text-decoration:underline; text-underline-offset:2px;
  }
  .linkish:hover:not(:disabled) { background:none; color:var(--primary-hover); }
  /* Every label after the first field wants air above it; the inputs are
     siblings rather than wrapped rows, so this is the simplest honest rule. */
  form > label:not(:first-of-type), form > div:not([hidden]) + label { margin-top:14px; }
  form > div:not([hidden]) ~ div:not([hidden]) { margin-top:14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M2 2h6v3H5v14h3v3H2zM22 2h-6v3h3v14h-3v3h6z"/>
        <path d="M5 10h8v4H5z"/>
      </svg>
      <b>dc-tracker</b><span>console</span>
    </div>
    <h1 id="title">Sign in</h1>
    <p class="lede" id="lede">The whole dataset is behind this, and each account
      keeps its own watchlist.</p>

    <form id="f" autocomplete="off">
      <!-- The invite field is first when it is showing, because somebody
           redeeming a code has it on their clipboard and nothing else yet. -->
      <div id="codewrap" hidden>
        <label for="code">Invite code</label>
        <input id="code" name="code" type="text" autocomplete="off" spellcheck="false" />
      </div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username"
             spellcheck="false" autofocus required />

      <div id="namewrap" hidden>
        <label for="name">Name <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input id="name" name="name" type="text" autocomplete="name" />
      </div>

      <label for="pw" id="pwlabel">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required />
      <button id="go" type="submit">Sign in</button>
    </form>

    <div id="msg" class="msg"></div>

    <p class="note">
      <button type="button" id="toggle" class="linkish">I have an invite code</button><br />
      Sessions last 12 hours. Repeated failures lock the gate for 15 minutes —
      if you are locked out and it was you, wait rather than retrying.
    </p>
  </main>

<script>
  const form  = document.getElementById("f");
  const email = document.getElementById("email");
  const pw    = document.getElementById("pw");
  const code  = document.getElementById("code");
  const name  = document.getElementById("name");
  const button = document.getElementById("go");
  const msg   = document.getElementById("msg");
  const toggle = document.getElementById("toggle");

  /* One form, two modes, one file.
   *
   * A separate /register page would be a second thing an unauthenticated request
   * can fetch, and the whole point of this page is that there is exactly one —
   * self-contained, describing nothing about what is behind it. So redeeming an
   * invite shows two more fields and posts somewhere else. */
  let registering = false;

  const setMode = (on) => {
    registering = on;
    document.getElementById("codewrap").hidden = !on;
    document.getElementById("namewrap").hidden = !on;
    code.required = on;
    document.getElementById("title").textContent = on ? "Redeem an invite" : "Sign in";
    document.getElementById("lede").textContent = on
      ? "Your code came from whoever runs this. Choose the email and password you will sign in with."
      : "The whole dataset is behind this, and each account keeps its own watchlist.";
    document.getElementById("pwlabel").textContent = on ? "Choose a password" : "Password";
    pw.setAttribute("autocomplete", on ? "new-password" : "current-password");
    button.textContent = on ? "Create account" : "Sign in";
    toggle.textContent = on ? "I already have an account" : "I have an invite code";
    msg.className = "msg";
    (on ? code : email).focus();
  };

  toggle.addEventListener("click", () => setMode(!registering));

  const show = (text, kind) => {
    msg.textContent = text;
    msg.className = "msg msg--" + kind;
  };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    msg.className = "msg";
    const route = registering ? "/api/register" : "/api/login";
    const body = registering
      ? { code: code.value.trim(), email: email.value, password: pw.value, name: name.value }
      : { email: email.value, password: pw.value };
    try {
      const res = await fetch(route, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Console": "1" },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        // Replace rather than assign: the login page should not sit in history
        // behind the console. Registering signs you straight in, so both land here.
        window.location.replace("/");
        return;
      }
      const payload = await res.json().catch(() => ({}));
      show(payload.error || "That did not work.", res.status === 429 ? "warn" : "err");
      // Keep what they typed except the password — retyping an email to fix a
      // password is the kind of small insult that makes people write it down.
      pw.value = "";
      pw.focus();
    } catch {
      show("The console did not answer. Is it still running?", "err");
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
