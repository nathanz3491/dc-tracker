<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1410" media="(prefers-color-scheme: dark)">
<title>Reset your password · dc-tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a05e1c'><path d='M2 2h6v3H5v14h3v3H2zM22 2h-6v3h3v14h-3v3h6z'/><path d='M5 10h8v4H5z'/></svg>">
<link rel="stylesheet" href="/static/public/site.css">
<script src="/static/public/site.js"></script>
</head>
<body data-page="forgot">

<header class="bar"><div class="wrap"><a class="brand" href="/" aria-label="dc-tracker, front page"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M2 2h6v3H5v14h3v3H2zM22 2h-6v3h3v14h-3v3h6z"/><path d="M5 10h8v4H5z"/></svg><b>dc-tracker</b></a></div></header>

<main class="auth"><div class="card">
  <div class="card-head">
    <p class="eyebrow" id="eyebrow">Step 1 of 2 · Password</p>
    <h1 id="title" tabindex="-1">Reset your password</h1>
    <p class="lede" id="lede">We'll email you a link to choose a new one. It works for an hour.</p>
  </div>
  <div class="card-body">
    <form id="form" method="post" novalidate>
      <div>
        <div class="row"><label class="label" for="email">Email</label></div>
        <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" autocapitalize="none" autofocus>
      </div>
      <button class="btn btn--primary go" id="go" type="submit"><span id="go-label">Email me a link</span><span class="arrow" aria-hidden="true">→</span></button>
    </form>
    <p id="result" class="result" hidden></p>
    <a id="action" class="btn btn--primary go" href="/signin" hidden>Sign in <span class="arrow" aria-hidden="true">→</span></a>
    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
    <noscript><p class="msg msg--warn">This form needs JavaScript. Turn it on for this site, then reload.</p></noscript>
  </div>
  <div class="card-foot" id="foot">Remembered it? <a href="/signin">Sign in</a></div>
</div></main>

<footer class="foot-site foot-site--compact"><div class="wrap"><p class="label">Private console · US data-center construction</p></div></footer>

</body>
</html>
