<body data-page="confirm">

<header class="bar"><div class="wrap"><a class="brand" href="/" aria-label="dc-tracker, front page"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M2 2h6v3H5v14h3v3H2zM22 2h-6v3h3v14h-3v3h6z"/><path d="M5 10h8v4H5z"/></svg><b>dc-tracker</b></a></div></header>

<main class="auth"><div class="card">
  <div class="card-head">
    <p class="eyebrow" id="eyebrow">Step 2 of 3 · Your email</p>
    <h1 id="title" tabindex="-1">Confirm your email</h1>
    <p class="lede" id="lede">One click confirms the address this link was sent to.</p>
  </div>
  <div class="card-body">
    <form id="form" method="post" novalidate>
      <button class="btn btn--primary go" id="go" type="submit" autofocus><span id="go-label">Confirm my email</span><span class="arrow" aria-hidden="true">→</span></button>
    </form>
    <p id="result" class="result" hidden></p>
    <a id="action" class="btn btn--primary go" href="/signin" hidden>Sign in <span class="arrow" aria-hidden="true">→</span></a>
    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>
    <noscript><p class="msg msg--warn">This form needs JavaScript. Turn it on for this site, then reload.</p></noscript>
  </div>
  <div class="card-foot" id="foot"><a href="/">Back to the front page</a></div>
</div></main>

<footer class="foot-site foot-site--compact"><div class="wrap"><p class="label">Private console · US data-center construction</p></div></footer>
